<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Servidor de datos - Geophone</title>
<link rel="stylesheet" href="/static/css/app.css">
<script src="/static/js/theme-boot.js"></script>
</head>
<body>
<header class="topbar">
  <h1>Servidor de datos</h1>
  <p class="sub">Las capturas llegan de la SPA del maestro, se descomprimen y se preprocesan
  solas. Acá se ve qué está listo para validar.</p>
  <span id="server-meta" class="server-meta" title="Identidad del proceso activo">comprobando servidor…</span>
  <button id="btn-theme" class="theme-toggle" type="button" aria-label="Cambiar tema">🌓</button>
</header>

<nav class="tabs" id="tabs">
  <button class="tab-btn active" data-tab="capturas">Capturas</button>
  <button class="tab-btn" data-tab="filtros">Filtros</button>
  <button class="tab-btn" data-tab="agrupamiento">Agrupamiento</button>
  <button class="tab-btn" data-tab="enfase">Enfase</button>
  <button class="tab-btn" data-tab="promedios">Promedios / arrivals</button>
  <button class="tab-btn" data-tab="waterfall">Waterfall</button>
  <button class="tab-btn" data-tab="masw">MASW</button>
  <button class="tab-btn" data-tab="borrado">Borrado</button>
</nav>

<main id="tab-panels">
  <section id="panel-capturas" class="tab-panel active"></section>

  <section id="panel-filtros" class="tab-panel" hidden></section>

  <section id="panel-agrupamiento" class="tab-panel" hidden></section>

  <section id="panel-enfase" class="tab-panel" hidden></section>

  <section id="panel-promedios" class="tab-panel" hidden></section>

  <section id="panel-waterfall" class="tab-panel" hidden></section>

  <section id="panel-masw" class="tab-panel" hidden>
    <nav class="subtabs" id="masw-subtabs">
      <button class="subtab-btn active" data-subtab="dispersion">1. Dispersion</button>
      <button class="subtab-btn" data-subtab="inversion">2. Inversion</button>
      <button class="subtab-btn" data-subtab="perfil">3. Perfil Vs</button>
    </nav>
    <section id="subpanel-dispersion" class="subtab-panel"></section>
    <section id="subpanel-inversion" class="subtab-panel" hidden></section>
    <section id="subpanel-perfil" class="subtab-panel" hidden></section>
  </section>

  <section id="panel-borrado" class="tab-panel" hidden></section>
</main>

<script type="module" src="/static/js/main.js"></script>
</body>
</html>
